[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "batchtextreview"
dynamic = ["version"]
description = "Run prompts over a text corpus with local LLMs, then score the results against gold labels."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "tripptytrip" }]
keywords = ["llm", "streamlit", "transformers", "text-classification", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "streamlit>=1.65",
    "pandas>=2.2",
    "pyarrow>=14",
    "altair>=5.4",
    "openpyxl>=3.1",
    "truststore>=0.9; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/tripptytrip/batchtextreview"
Changelog = "https://github.com/tripptytrip/batchtextreview/blob/HEAD/CHANGELOG.md"

[project.optional-dependencies]
# Local inference. Install torch first as README.md describes: with an NVIDIA
# GPU, from https://download.pytorch.org/whl/cu130, because PyPI's Windows
# torch is CPU-only. This extra then adds the Hugging Face stack.
llm = [
    "torch>=2.4",
    "transformers>=4.56",
    "accelerate>=1.0",
    "bitsandbytes>=0.45; platform_system != 'Darwin'",
]
# Cloud models through the providers' APIs (no GPU needed); keyring saves
# API keys in the operating system's credential store.
api = [
    "anthropic>=1.15",
    "openai>=3.33",
    "keyring>=25",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # Exact: ruff's rules and formatter change between releases, so CI and
    # every checkout must lint and format with the same one. Bump on purpose.
    "ruff==0.17.0",
    "mypy>=1.10",
    # tests/test_packaging.py builds the sdist and wheel with it.
    "hatchling>=1.24",
]

[project.scripts]
batchtextreview = "batchtextreview.cli:main"

[tool.hatch.version]
path = "src/batchtextreview/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/batchtextreview"]

# The project's Streamlit config, next to the bundled entry point
# (ui/streamlit_app.py) that a regular install launches: Streamlit reads
# <script folder>/.streamlit/config.toml.
[tool.hatch.build.targets.wheel.force-include]
".streamlit/config.toml" = "batchtextreview/ui/.streamlit/config.toml"

# An allow-list, so stray files in the checkout (a .env, data, result
# exports) never end up in a source archive.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples/sample_feedback.csv",
    "/app.py",
    "/.streamlit/config.toml",
    "/README.md",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "llm: needs torch + transformers (builds a tiny random model locally; no download)",
    "ui: Streamlit AppTest tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:altair.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long lines: formatter handles code, prose strings may run long
    "RUF001",  # ambiguous unicode in strings (UI copy uses typographic dashes)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["batchtextreview"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
