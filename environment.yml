# Conda environment for Batch Text Review with an NVIDIA GPU (Windows or Linux).
#
#   conda env create -f environment.yml      (run from the repository root)
#   conda activate batchtextreview
#   python -c "import torch; print(torch.__version__, torch.cuda.is_available())"
#
# The check should print True. On Windows the version should also end in
# "+cu128"; if it doesn't, pip picked a CPU-only build - see "Troubleshooting"
# in README.md.
#
# PyTorch no longer publishes conda packages, so conda provides only Python and
# pip installs the CUDA build of PyTorch from download.pytorch.org.
# cu128 (CUDA 12.8) suits GeForce RTX 20xx to 50xx cards with a recent driver.
# Older cards (GTX 10xx) need the cu126 index instead. If the selector at
# https://pytorch.org/get-started/locally/ (Stable, Pip, CUDA) shows another
# index URL for your card, use that one below.
#
# CPU-only machines and macOS: don't use this file - see "Quick start" in
# README.md.
#
# To update after pulling new code:
#   conda env update -f environment.yml --prune

name: batchtextreview
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      # The app itself (editable), plus torch / transformers / accelerate /
      # bitsandbytes ("llm") and pytest / ruff / mypy ("dev").
      - -e .[llm,dev]
