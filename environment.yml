# Conda environment for Batch Text Review with an NVIDIA GPU (Windows or Linux):
# Python and the CUDA build of PyTorch. The app is installed into it next.
#
#   conda env create -f environment.yml      (run from the repository root)
#   conda activate batchtextreview
#   pip install -e ".[llm]"
#   python -c "import torch; print(torch.__version__, torch.cuda.is_available())"
#
# The check should print a version ending in "+cu130", then True. If it
# doesn't, see "Troubleshooting" in README.md.
#
# Channels: conda-forge only. "nodefaults" stops conda adding Anaconda's own
# channel (repo.anaconda.com) from your conda settings. Nothing here needs it,
# and it refuses unregistered company networks ("HTTP 429 Too Many Requests").
#
# PyTorch comes from download.pytorch.org and nowhere else. With PyPI as a
# second index, pip takes PyPI's build whenever it is newer, and on Windows
# that build is CPU-only.
#
# cu130 is the CUDA 13.0 build. It needs an NVIDIA driver for CUDA 13.0 or
# later (nvidia-smi shows "CUDA Version: 13.0" or higher; driver 580 or newer)
# and a GeForce GTX 16xx / RTX 20xx or newer card. For an older card, or a
# driver you can't update, replace the index URL below with the one that
# https://pytorch.org/get-started/locally/ shows (Stable, Pip, the highest CUDA
# version nvidia-smi allows).
#
# CPU-only machines and macOS: don't use this file - see "Quick start" in
# README.md.
#
# To update PyTorch later:  conda env update -f environment.yml

name: batchtextreview
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cu130
      - torch
